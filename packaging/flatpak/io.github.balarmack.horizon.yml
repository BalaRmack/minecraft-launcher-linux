id: io.github.balarmack.horizon
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: horizon
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  # LWJGL 2 requires X11 even when the launcher uses native Wayland.
  - --socket=x11
  - --socket=pulseaudio
  - --device=dri
  - --env=WEBKIT_DISABLE_DMABUF_RENDERER=1
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/horizon/cargo-home
    CARGO_NET_OFFLINE: 'true'
modules:
  # LWJGL 2 invokes xrandr to enumerate display modes (Minecraft <= 1.12).
  - name: xrandr
    sources:
      - type: archive
        url: https://www.x.org/archive/individual/app/xrandr-1.5.4.tar.gz
        sha256: b022276f1f2e6e206803027a5f569e6eb51e69d2d8886bfb5a7bc0612ddca4ee
  - name: horizon
    buildsystem: simple
    build-commands:
      - cargo build --manifest-path src-tauri/Cargo.toml --release --locked --offline --features custom-protocol,smoke-test
      - install -Dm755 src-tauri/target/release/horizon /app/bin/horizon
      - install -Dm644 packaging/flatpak/io.github.balarmack.horizon.desktop /app/share/applications/io.github.balarmack.horizon.desktop
      - install -Dm644 packaging/flatpak/io.github.balarmack.horizon.metainfo.xml /app/share/metainfo/io.github.balarmack.horizon.metainfo.xml
      - install -Dm644 src-tauri/icons/icon.png /app/share/icons/hicolor/256x256/apps/io.github.balarmack.horizon.png
    sources:
      - type: dir
        path: ../../.flatpak-source
