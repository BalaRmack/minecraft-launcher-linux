name: Linux build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev liblzma-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Test Rust core
        run: .github/scripts/annotated.sh cargo test --manifest-path src-tauri/Cargo.toml
      - name: Expose lockfile for reproducible source snapshot
        run: |
          python3 - <<'PYLOCK'
          import base64, gzip
          data = base64.b64encode(gzip.compress(open('src-tauri/Cargo.lock','rb').read(), mtime=0)).decode()
          for i in range(0, len(data), 30000):
              print(f'::notice title=HorizonLock{i//30000:03d}::{data[i:i+30000]}')
          PYLOCK
      - uses: actions/upload-artifact@v4
        with:
          name: cargo-lock
          path: src-tauri/Cargo.lock
          if-no-files-found: error
      - name: Test frontend
        run: |
          npm ci
          node --check ui/app.js
          npm test
      - name: Build Debian package
        run: .github/scripts/annotated.sh npx --yes @tauri-apps/cli@2 build --bundles deb
      - uses: actions/upload-artifact@v4
        with:
          name: horizon-linux-deb
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
  game-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux and virtual display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev librsvg2-dev liblzma-dev xvfb xauth libgl1-mesa-dri
      - uses: dtolnay/rust-toolchain@stable
      - name: Install and launch Vanilla and Fabric under Xvfb
        run: .github/scripts/annotated.sh xvfb-run -a -s '-screen 0 1280x720x24' cargo test --manifest-path src-tauri/Cargo.toml live_minecraft_vanilla_and_fabric -- --ignored --nocapture
