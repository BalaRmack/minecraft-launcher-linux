name: Linux build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev liblzma-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Test Rust core
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Test frontend
        run: |
          npm ci
          node --check ui/app.js
          npm test
      - name: Build Debian package
        run: npx --yes @tauri-apps/cli@2 build --bundles deb
      - uses: actions/upload-artifact@v4
        with:
          name: horizon-linux-deb
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
